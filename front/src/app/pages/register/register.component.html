<div class="auth">
  <header class="auth-top">
    <div class="container auth-top__bar">
      <a class="back-link" routerLink="/" aria-label="Retour">←</a>
      <div class="brand brand__mini">
        <img class="brand__svg" src="assets/logo_p6.png" alt="MDD" />
      </div>
      <span aria-hidden="true"></span>
    </div>
  </header>

  <main class="auth-main">
    <section class="card auth-card">
      <h1 class="page__title center">Inscription</h1>

      <form class="form" [formGroup]="form" (ngSubmit)="submit()">
        <div class="field">
          <label for="su-username">Nom d’utilisateur</label>
          <input class="input" id="su-username" formControlName="username" type="text" autocomplete="username" />
          <p class="field-error" *ngIf="form.controls.username.touched && form.controls.username.hasError('required')">Champ requis</p>
          <p class="field-error" *ngIf="fieldErrors['username']">{{ fieldErrors['username'] }}</p>
        </div>

        <div class="field">
          <label for="su-email">Adresse e-mail</label>
          <input class="input" id="su-email" formControlName="email" type="email" autocomplete="email" />
          <p class="field-error" *ngIf="form.controls.email.touched && form.controls.email.hasError('required')">Champ requis</p>
          <p class="field-error" *ngIf="form.controls.email.touched && form.controls.email.hasError('email')">E-mail invalide</p>
          <p class="field-error" *ngIf="fieldErrors['email']">{{ fieldErrors['email'] }}</p>
        </div>

        <div class="field">
          <label for="su-password">Mot de passe</label>
          <input class="input" id="su-password" formControlName="password" type="password" autocomplete="new-password" />
          <p class="field-error" *ngIf="form.controls.password.touched && form.controls.password.hasError('required')">Champ requis</p>
          <p class="field-error" *ngIf="form.controls.password.touched && form.controls.password.hasError('pattern')">
            8+ caractères, 1 minuscule, 1 majuscule, 1 chiffre, 1 spécial
          </p>
          <p class="field-error" *ngIf="fieldErrors['password']">{{ fieldErrors['password'] }}</p>
        </div>

        <p class="form-error" *ngIf="formError">{{ formError }}</p>

        <button class="btn btn--primary" type="submit" [disabled]="loading || form.invalid">S’inscrire</button>
      </form>
    </section>
  </main>
</div>
