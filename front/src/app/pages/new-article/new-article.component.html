<main class="page">
  <div class="container">
    <a class="back-link" routerLink="/articles">←</a>

    <section class="card mt-2" style="width: min(620px, 100%); margin-inline: auto">
      <h1 class="page__title center">Créer un nouvel article</h1>

      <p class="form-error" *ngIf="error">{{ error }}</p>

      <form class="form" [formGroup]="form" (ngSubmit)="submit()">
        <div class="field">
          <label for="theme">Sélectionner un thème</label>
          <select class="select" id="theme" formControlName="topicId" required>
            <option [ngValue]="null">— Choisir —</option>
            <option *ngFor="let topic of topics" [ngValue]="topic.id">{{ topic.title }}</option>
          </select>
          <p class="field-error" *ngIf="form.controls.topicId.touched && form.controls.topicId.hasError('required')">Champ requis</p>
        </div>

        <div class="field">
          <label for="title">Titre de l’article</label>
          <input class="input" id="title" formControlName="title" type="text" required />
          <p class="field-error" *ngIf="form.controls.title.touched && form.controls.title.hasError('required')">Champ requis</p>
        </div>

        <div class="field">
          <label for="content">Contenu de l’article</label>
          <textarea class="textarea" id="content" formControlName="content" required></textarea>
          <p class="field-error" *ngIf="form.controls.content.touched && form.controls.content.hasError('required')">Champ requis</p>
        </div>

        <button class="btn btn--primary" type="submit" style="justify-self: center" [disabled]="loading || form.invalid">Créer</button>
      </form>
    </section>
  </div>
</main>
