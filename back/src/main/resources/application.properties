server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mdd?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:mdd}
spring.datasource.password=${DB_PASSWORD:mdd}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

app.jwt.secret=${JWT_SECRET:CHANGE_ME_CHANGE_ME_CHANGE_ME_CHANGE_ME_CHANGE_ME_CHANGE_ME_123456}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}
