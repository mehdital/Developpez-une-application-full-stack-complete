services:
  db:
    image: mysql:8.0
    container_name: mdd-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: mdd
      MYSQL_USER: mdd
      MYSQL_PASSWORD: mdd
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mdd_mysql_data:/var/lib/mysql
    command:
      - "--default-authentication-plugin=mysql_native_password"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  back:
    build:
      context: ./back
    container_name: mdd-back
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/mdd?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: mdd
      DB_PASSWORD: mdd
      CORS_ALLOWED_ORIGINS: http://localhost:4200
      JWT_SECRET: CHANGE_ME_CHANGE_ME_CHANGE_ME_CHANGE_ME_CHANGE_ME_CHANGE_ME_123456
      JWT_EXPIRATION_SECONDS: 86400
    ports:
      - "8080:8080"

  front:
    build:
      context: ./front
    container_name: mdd-front
    restart: unless-stopped
    depends_on:
      - back
    ports:
      - "4200:80"

volumes:
  mdd_mysql_data:
